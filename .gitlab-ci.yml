image: ubuntu:24.04

variables:
  DEBIAN_FRONTEND: noninteractive

stages:
  - build

build_job:
  stage: build
  before_script:
    - apt-get update && apt-get install -y gcc make
  script:
    - make
  artifacts:
    paths:
      - build/
  rules:
 
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(dev|main)$/
   
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
  
    - if: $CI_COMMIT_BRANCH

